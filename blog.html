<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Blog</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>

    <header>
        <h1>My Book Blog</h1>
    </header>

    <main>
        <article class="book-card">

            <img
                src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg"
                alt="Cover of The Magician's Nephew by C. S. Lewis">

            <div class="book-info">
                <h2>The Magician's Nephew</h2>

                <p class="author">
                    By C. S. Lewis
                </p>

                <p>
                    The Magician's Nephew is the first story in the
                    Chronicles of Narnia series. It follows Digory and Polly
                    as they explore magical worlds, witness the creation
                    of Narnia, and encounter powerful forces of good and evil.
                </p>

                <p>
                    <strong>Rating:</strong> ★★★★☆
                </p>
            </div>

        </article>
    </main>

</body>
</html>
