<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Delicious recipes for every occasion.">
    <meta property="og:url" content="https://yourgithubusername.github.io/wdd131/recipes/">
    <meta property="og:image" content="images/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Delicious recipes for every occasion.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>

<body>

<header>
    <div class="logo">
        <img src="images/recipe-book.png" alt="Recipe Book Logo">
        <h1>Recipe Book</h1>
    </div>
</header>

<main>

    <section class="search-section">
        <input type="text" placeholder="Find a recipe">
        <button>
            <img src="images/search.svg" alt="Search">
        </button>
    </section>

    <article class="recipe-card">

        <img
            class="recipe-image"
            src="images/apple-crisp.jpg"
            alt="Apple Crisp">

        <div class="recipe-content">
            <h2>Apple Crisp</h2>
            <p>A delicious apple crisp recipe perfect for any occasion.</p>
        </div>
    </article>
</main>
</body>
</html>
